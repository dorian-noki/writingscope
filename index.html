<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WritingScope - 小説推敲補助ツール</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    /* =====================
       CSS変数・リセット
    ===================== */
    :root {
      --bg:         #f0f4f8;
      --surface:    #ffffff;
      --surface2:   #e8eef5;
      --blue-dark:  #0a2540;
      --blue-mid:   #1565c0;
      --blue-light: #2196f3;
      --blue-pale:  #bbdefb;
      --accent:     #00b0ff;
      --text:       #0a2540;
      --text-muted: #546e7a;
      --border:     #cfd8dc;
      --highlight:  #e3f2fd;
      --tag-bg:     #e1f0ff;
      --radius:     8px;
      --font-main:  'Noto Sans JP', sans-serif;
      --font-mono:  'IBM Plex Mono', monospace;
      --header-h:   52px;
      --tab-h:      44px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.7;
    }

    button { font-family: inherit; }

    /* =====================
       ヘッダー
    ===================== */
    header {
      background: var(--blue-dark);
      color: #fff;
      padding: 0 16px;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      border-bottom: 2px solid var(--blue-light);
    }

    .header-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      font-family: var(--font-mono);
      color: var(--accent);
    }

    .header-subtitle {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      font-family: var(--font-mono);
      margin-left: 8px;
    }

    .key-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.85);
      border-radius: 6px;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      min-height: 32px;
    }
    .key-btn:hover { border-color: var(--accent); color: var(--accent); }

    .key-banner {
      background: #fff3e0;
      border-bottom: 1px solid #ffb300;
      padding: 8px 16px;
      font-size: 12px;
      color: #7c5c00;
      text-align: center;
      cursor: pointer;
    }

    /* =====================
       スマホ用タブナビゲーション
    ===================== */
    .tab-nav {
      display: none;
      background: var(--blue-dark);
      border-bottom: 1px solid var(--blue-mid);
      height: var(--tab-h);
      position: sticky;
      top: var(--header-h);
      z-index: 100;
    }

    .tab-nav-inner { display: flex; height: 100%; }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      padding: 0 4px;
    }

    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-icon { font-size: 14px; }

    /* =====================
       PC 3カラムレイアウト
    ===================== */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      height: calc(100vh - var(--header-h));
    }

    .panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .panel:last-child { border-right: none; }

    .panel-header {
      padding: 11px 14px 9px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--surface);
    }

    .panel-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--blue-mid);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-label::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--blue-light);
      border-radius: 50%;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      -webkit-overflow-scrolling: touch;
    }

    /* =====================
       左パネル：文章入力
    ===================== */
    .text-input {
      width: 100%;
      height: 170px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      font-family: var(--font-main);
      color: var(--text);
      resize: vertical;
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 8px;
      line-height: 1.8;
      font-size: 16px; /* iOSの自動ズーム防止 */
    }

    .text-input:focus { border-color: var(--blue-light); }

    .range-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      padding: 6px 8px 6px 12px;
      background: var(--highlight);
      border: 1px solid var(--blue-pale);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--blue-mid);
    }

    .range-btn {
      padding: 6px 12px;
      background: var(--blue-light);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      min-height: 34px;
      white-space: nowrap;
    }
    .range-btn:hover { background: var(--blue-mid); }

    .split-btn {
      width: 100%;
      padding: 10px;
      background: var(--blue-mid);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 12px;
      min-height: 44px;
    }

    .split-btn:hover  { background: #0d47a1; }
    .split-btn:active { background: #0a2f7a; }

    .sentence-list { display: flex; flex-direction: column; gap: 4px; }

    .sentence-item {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text);
      line-height: 1.7;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sentence-item:hover  { border-color: var(--blue-light); background: var(--highlight); }
    .sentence-item:active { background: var(--blue-pale); }

    .sentence-item.focused {
      border-color: var(--blue-light);
      background: var(--highlight);
      border-left: 3px solid var(--blue-light);
    }

    .sentence-no {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    .sentence-idx {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 6px;
    }

    /* =====================
       中央パネル：AI類似表現
    ===================== */
    .focus-display {
      background: var(--blue-dark);
      color: #e3f2fd;
      padding: 10px 14px;
      border-bottom: 1px solid var(--blue-mid);
      font-size: 13px;
      line-height: 1.8;
      flex-shrink: 0;
      max-height: 120px;
      overflow-y: auto;
    }

    .focus-label {
      font-size: 10px;
      color: var(--accent);
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      margin-bottom: 3px;
    }

    .generate-btn {
      padding: 8px 16px;
      background: var(--accent);
      color: var(--blue-dark);
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      min-height: 44px;
      white-space: nowrap;
    }

    .generate-btn:hover    { background: #0288d1; color: #fff; }
    .generate-btn:active   { background: #0277bd; color: #fff; }
    .generate-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .token-section { margin-bottom: 16px; }

    .token-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 8px;
    }

    .token-row {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      overflow: hidden;
    }

    .token-original {
      padding: 8px 12px;
      background: var(--surface2);
      font-size: 13px;
      font-weight: 500;
      color: var(--blue-dark);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .token-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .token-type {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--bg);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .reload-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      min-width: 28px;
      min-height: 28px;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .reload-btn:hover { border-color: var(--blue-light); color: var(--blue-light); }
    .reload-btn.spinning .reload-icon { animation: spin 0.7s linear infinite; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .token-alts {
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      transition: opacity 0.25s;
    }

    .alt-tag {
      padding: 6px 12px;
      background: var(--tag-bg);
      border: 1px solid var(--blue-pale);
      color: var(--blue-mid);
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
    }

    .alt-tag:hover    { background: var(--blue-mid); color: #fff; border-color: var(--blue-mid); }
    .alt-tag:active   { background: #0d47a1; color: #fff; }
    .alt-tag.selected { background: var(--blue-light); color: #fff; border-color: var(--blue-light); }

    .alt-tag.mismatch {
      background: #fff8e1;
      border: 1px dashed #ffb300;
      color: #7c5c00;
    }

    .alt-tag.mismatch:hover    { background: #ffe082; border-color: #f9a825; color: #4a3500; }
    .alt-tag.mismatch:active   { background: #ffd54f; }
    .alt-tag.mismatch.selected { background: #ffb300; color: #3e2c00; border-style: solid; }

    .tag-legend {
      display: flex;
      gap: 14px;
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 10px;
      padding: 6px 10px;
      background: var(--surface2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .tag-legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-dot.match    { background: var(--blue-light); }
    .legend-dot.mismatch { background: #ffb300; }

    /* =====================
       ローディング・エラー・空状態
    ===================== */
    .ai-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 12px;
      padding: 24px 0;
      justify-content: center;
    }

    .ai-loading.small { padding: 12px 0; }

    .ai-dots { display: flex; gap: 4px; }

    .ai-dots span {
      width: 7px; height: 7px;
      background: var(--blue-light);
      border-radius: 50%;
      animation: dotpulse 1.2s infinite;
    }

    .ai-dots span:nth-child(2) { animation-delay: 0.2s; }
    .ai-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotpulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    .error-msg {
      padding: 10px 12px;
      background: #fce4ec;
      border: 1px solid #ef9a9a;
      border-radius: var(--radius);
      color: #b71c1c;
      font-size: 12px;
      margin-bottom: 10px;
      line-height: 1.6;
      word-break: break-word;
    }

    .note-msg {
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      gap: 8px;
      padding: 20px;
      line-height: 1.9;
    }

    .empty-icon { font-size: 28px; opacity: 0.4; margin-bottom: 4px; }

    /* =====================
       右パネル：単語解説・文学文脈
    ===================== */
    .selected-tag-display {
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--highlight);
      border: 1px solid var(--blue-pale);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--blue-mid);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .selected-tag-display .tag-value { font-weight: 700; color: var(--blue-dark); }

    .replace-btn {
      width: 100%;
      margin: 0 0 14px;
      padding: 10px;
      background: var(--blue-mid);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      min-height: 40px;
    }
    .replace-btn:hover { background: #0d47a1; }
    .replace-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .word-card {
      border: 1px solid var(--blue-pale);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .word-card-header {
      padding: 10px 12px;
      background: linear-gradient(90deg, var(--blue-mid), var(--blue-light));
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .word-card-header .word-name    { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }
    .word-card-header .word-reading { font-size: 11px; color: rgba(255,255,255,0.75); font-family: var(--font-mono); }

    .word-card-body {
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.9;
      background: var(--surface);
    }

    .word-pos-badge {
      display: inline-block;
      font-size: 10px;
      font-family: var(--font-mono);
      background: var(--tag-bg);
      color: var(--blue-mid);
      border: 1px solid var(--blue-pale);
      border-radius: 4px;
      padding: 1px 7px;
      margin-bottom: 6px;
    }

    .word-definition { color: var(--text); margin-bottom: 8px; }

    .word-nuance {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface2);
      border-left: 3px solid var(--blue-light);
      padding: 6px 10px;
      border-radius: 0 4px 4px 0;
    }

    .right-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin: 14px 0 8px;
    }

    .context-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .context-card-header {
      padding: 8px 12px;
      background: var(--blue-dark);
      color: #e3f2fd;
    }

    .context-card-header .work-title  { font-weight: 700; font-size: 12px; color: #fff; }
    .context-card-header .work-title a { color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,0.5); }
    .context-card-header .work-title a:hover { color: var(--accent); }
    .context-card-header .work-author { color: var(--accent); font-size: 10px; font-family: var(--font-mono); }

    .context-card-body {
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.9;
      color: var(--text);
      word-break: break-word;
    }

    .match-word {
      background: var(--blue-pale);
      border-radius: 3px;
      padding: 0 3px;
      font-weight: 700;
      color: var(--blue-dark);
    }

    .word-senses { margin: 0 0 8px 18px; }
    .word-senses li { margin-bottom: 2px; }
    .word-more { margin-bottom: 8px; }
    .word-more summary { cursor: pointer; color: var(--blue-mid); font-size: 11px; margin-bottom: 4px; }
    .word-headword { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }

    .dict-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 14px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .dict-links a {
      padding: 4px 10px;
      border: 1px solid var(--blue-pale);
      border-radius: 14px;
      color: var(--blue-mid);
      text-decoration: none;
      background: var(--tag-bg);
    }
    .dict-links a:hover { background: var(--blue-mid); color: #fff; }

    .source-note {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-top: 4px;
    }

    /* =====================
       APIキーダイアログ・トースト
    ===================== */
    dialog {
      border: none;
      border-radius: 12px;
      padding: 20px;
      width: min(420px, calc(100vw - 32px));
      margin: auto;
      color: var(--text);
      box-shadow: 0 12px 40px rgba(10,37,64,0.35);
    }
    dialog::backdrop { background: rgba(10,37,64,0.5); }
    dialog h2 { font-size: 15px; margin-bottom: 8px; }
    dialog p  { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.7; }
    dialog a  { color: var(--blue-mid); }

    dialog input[type=password], dialog input[type=text] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    dialog input:focus { border-color: var(--blue-light); }

    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .dialog-actions button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      font-size: 12px;
      min-height: 36px;
    }
    .dialog-actions .primary { background: var(--blue-mid); border-color: var(--blue-mid); color: #fff; }
    .dialog-actions .danger  { color: #b71c1c; margin-right: auto; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--blue-dark);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      max-width: calc(100vw - 32px);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--blue-light); }

    @media (max-width: 1100px) and (min-width: 769px) {
      .layout { grid-template-columns: 260px 1fr 260px; }
    }

    /* =====================
       スマホ対応（768px以下）
    ===================== */
    @media (max-width: 768px) {
      .tab-nav { display: block; }

      .layout {
        grid-template-columns: 1fr;
        height: calc(100vh - var(--header-h) - var(--tab-h));
        overflow: hidden;
      }

      .panel {
        display: none;
        height: calc(100vh - var(--header-h) - var(--tab-h));
      }

      .panel.tab-active { display: flex; }

      .text-input { height: 180px; }

      .focus-display { font-size: 12px; max-height: 80px; }

      .header-subtitle { display: none; }
    }
  </style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header>
  <div>
    <span class="header-title">WritingScope</span>
    <span class="header-subtitle">AIに書かせない小説推敲補助ツール</span>
  </div>
  <button class="key-btn" id="keyBtn" type="button">⚙ APIキー</button>
</header>

<div class="key-banner" id="keyBanner" hidden>
  ⚠️ Gemini APIキーが未設定です。ここをクリックして設定してください（類似表現の生成に必要です）。
</div>

<!-- ===== スマホ用タブナビ ===== -->
<nav class="tab-nav">
  <div class="tab-nav-inner">
    <button class="tab-btn active" type="button" data-tab="0">

      キーは <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で取得できます。

<script>
  // =====================
  //   設定
  // =====================
  const GEMINI_MODEL = 'gemini-3.8-flash';
  const GEMINI_URL   = 'https://generativelanguage.googleapis.com/v1beta/interactions'; // Interactions API
  const WIKISOURCE_API = 'https://ja.wikisource.org/w/api.php';
  const WIKTIONARY_API = 'https://ja.wiktionary.org/w/api.php';
  const KUROMOJI_BASE  = 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/';
  const LS_KEY   = 'writingscope.geminiKey';
  const LS_DRAFT = 'writingscope.draft';
  const SAMPLE_TEXT = '夜が静かに更けていく。窓の外には、うっすらと雪が降り積もっていた。彼女はその白い景色をただ眺めながら、言葉を探していた。だが、うまく見つからない。心の中に渦巻く感情は、あまりにも複雑で、言語化するには程遠かった。';

  // =====================
  //   状態管理
  // =====================
  const state = {
    sentences: [],      // [{text, start, end}]
    split: false,       // 一度でも分割したか（以後は編集に追従して再分割）
    focus: null,        // {text, start, end, kind: 'sentence'|'range', index}
    tokens: [],         // [{word, type, alts: [{word, mismatch}]}]
    activeTag: null,    // {tokenIdx, altIdx}
    baseText: '',       // 最後に分割したときの本文（文リストの位置の基準）
    selection: null,    // テキストエリアの選択範囲 {start, end}
  };
  let genSeq = 0;       // 生成の競合防止
  let selectSeq = 0;    // タグ選択の競合防止

  const $ = id => document.getElementById(id);
  const ta = $('mainText');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const loadingHtml = (msg, small) => `
    <div class="ai-loading${small ? ' small' : ''}">
      <div class="ai-dots"><span></span><span></span><span></span></div>
      <span>${esc(msg)}</span>
    </div>`;

  const emptyHtml = (icon, html) =>
    `<div class="empty-state"><div class="empty-icon">${icon}</div><div>${html}</div></div>`;

  let toastTimer;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2600);
  }

  const isMobile = () => window.innerWidth <= 768;

  // =====================
  //   APIキー管理
  // =====================
  const getKey = () => (localStorage.getItem(LS_KEY) || '').trim();

  function updateKeyBanner() {
    $('keyBanner').hidden = !!getKey();
  }

  function openKeyDialog() {
    $('keyInput').value = getKey();
    $('keyDialog').showModal();
  }

  $('keyBtn').addEventListener('click', openKeyDialog);
  $('keyBanner').addEventListener('click', openKeyDialog);
  $('keyCancel').addEventListener('click', () => $('keyDialog').close());
  $('keyClear').addEventListener('click', () => {
    localStorage.removeItem(LS_KEY);
    $('keyDialog').close();
    updateKeyBanner();
    toast('APIキーを削除しました');
  });
  $('keyForm').addEventListener('submit', () => {
    const v = $('keyInput').value.trim();
    if (v) localStorage.setItem(LS_KEY, v);
    updateKeyBanner();
    if (v) toast('APIキーを保存しました');
  });

  // =====================
  //   スマホ：タブ切り替え
  // =====================
  function switchTab(idx) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
    document.querySelectorAll('.panel').forEach((panel, i) => panel.classList.toggle('tab-active', i === idx));
  }

  document.querySelector('.tab-nav').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (btn) switchTab(Number(btn.dataset.tab));
  });

  // =====================
  //   ② 文章を「。」または改行で分割する
  //   ！？も区切りとし、直後の閉じ括弧は前の文に含める
  // =====================
  function splitSentences(raw) {
    const re = /[^。！？!?\r\n]*[。！？!?]+[」』）)】〕]*|[^。！？!?\r\n]+/g;
    const out = [];
    for (const m of raw.matchAll(re)) {
      const lead = m[0].length - m[0].trimStart().length;
      const text = m[0].trim();
      if (!text) continue;
      const start = m.index + lead;
      out.push({ text, start, end: start + text.length });
    }
    return out;
  }

  function splitText() {
    const prev = state.focus;
    const prevAlt = state.activeTag && state.tokens[state.activeTag.tokenIdx]
      ? state.tokens[state.activeTag.tokenIdx].alts[state.activeTag.altIdx]?.word : null;

    state.split = true;
    state.sentences = splitSentences(ta.value);
    state.baseText = ta.value;
    renderSentenceList();
    if (!state.sentences.length) {
      toast('分割できる文がありません');
      if (prev) setFocus(null);
      return;
    }
    if (!prev) return;

    // 編集済みの本文に合わせて③のフォーカスを移し、内容が変わっていれば④⑤を再生成する
    const next = remapFocus(prev.base || ta.value, ta.value, prev);
    if (!next) { setFocus(null); return; }
    if (next.text === prev.text) {
      state.focus = next;
      renderFocus();
      return;
    }
    setFocus(next);
    regenerateFocus(prevAlt);
  }

  function renderSentenceList() {
    const count = $('sentenceCount');
    count.hidden = !state.split;
    count.textContent = `${state.sentences.length} 文に分割`;

    const f = state.focus;
    $('sentenceList').innerHTML = state.sentences.map((s, i) => `
      <div class="sentence-item${f && f.kind === 'sentence' && f.index === i ? ' focused' : ''}"
           role="button" tabindex="0" data-i="${i}">
        <span class="sentence-no">${String(i + 1).padStart(2, '0')}</span><span>${esc(s.text)}</span>
      </div>`).join('');
  }

  $('splitBtn').addEventListener('click', splitText);

  $('sentenceList').addEventListener('click', e => {
    const item = e.target.closest('[data-i]');
    if (item) focusSentence(Number(item.dataset.i));
  });
  $('sentenceList').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const item = e.target.closest('[data-i]');
    if (item) { e.preventDefault(); focusSentence(Number(item.dataset.i)); }
  });

  // =====================
  //   ③ フォーカス（文の指定 / 任意範囲の選択）
  // =====================
  function focusSentence(i) {
    const s = state.sentences[i];
    if (!s) return;
    setFocus({ text: s.text, start: s.start, end: s.end, kind: 'sentence', index: i, base: state.baseText });
  }

  function resetResults() {
    genSeq++; selectSeq++;
    state.tokens = [];
    state.activeTag = null;
    $('centerBody').innerHTML = emptyHtml('🔍', '「生成する」を押すと<br>AIが類似表現を提案します。');
    $('rightBody').innerHTML  = emptyHtml('📖', '類似表現タグをクリックすると<br>単語解説と文学作品の<br>文脈が表示されます。');
  }

  function renderFocus() {
    const f = state.focus;
    const ft = $('focusText');
    $('focusLabel').textContent = f && f.kind === 'range' ? '③ フォーカス中の範囲' : '③ フォーカス中の文';
    ft.style.color = f ? '#fff' : '#90caf9';
    ft.textContent = f ? f.text : '← 左の文をクリック、または本文を範囲選択';
    $('generateBtn').disabled = !f;
    renderSentenceList();
  }

  function setFocus(f) {
    state.focus = f;
    resetResults();
    renderFocus();
    if (f && isMobile()) switchTab(1);
  }

  // テキストエリアの選択範囲を追跡
  document.addEventListener('selectionchange', () => {
    if (document.activeElement !== ta) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const picked = ta.value.slice(start, end);
    if (picked.trim()) {
      state.selection = { start, end };
      $('rangeInfo').textContent = `${picked.trim().length} 文字を選択中`;
      $('rangeBar').hidden = false;
    } else {
      state.selection = null;
      $('rangeBar').hidden = true;
    }
  });

  // クリックでテキストエリアの選択が外れないようにする
  $('rangeBtn').addEventListener('mousedown', e => e.preventDefault());
  $('rangeBtn').addEventListener('click', () => {
    const sel = state.selection;
    if (!sel) return;
    const raw = ta.value.slice(sel.start, sel.end);
    const lead = raw.length - raw.trimStart().length;
    const text = raw.trim();
    if (!text) return;
    const start = sel.start + lead;
    setFocus({ text, start, end: start + text.length, kind: 'range', index: -1, base: ta.value });
  });

  // 本文の編集中は下書き保存のみ行う。②〜⑤の更新は「文章を分割する」を押したときに行う
  ta.addEventListener('input', () => {
    localStorage.setItem(LS_DRAFT, ta.value);
  });

  // 編集前後の文リストを対応づけ、フォーカス中の文が新しい文リストのどれに当たるか（なければ -1）を返す
  function mapSentenceIndex(f, newVal) {
    const oldS = splitSentences(f.base), newS = state.sentences;
    const n = oldS.length, m = newS.length;
    if (f.index < 0 || f.index >= n || !m) return -1;
    if (n * m > 4e6) return Math.min(f.index, m - 1);

    // 文テキストの最長共通部分列で、変更のない文どうしを対応づける
    const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = oldS[i].text === newS[j].text ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
    const match = new Map();
    for (let i = 0, j = 0; i < n && j < m;) {
      if (oldS[i].text === newS[j].text) { match.set(i, j); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    if (match.has(f.index)) return match.get(f.index);

    // 編集された文：前後の変更なしの文に挟まれた範囲から、最も似ている文を選ぶ
    let prevOld = -1, nextOld = n;
    for (const i of match.keys()) {
      if (i < f.index && i > prevOld) prevOld = i;
      if (i > f.index && i < nextOld) nextOld = i;
    }
    const lo = prevOld >= 0 ? match.get(prevOld) + 1 : 0;
    const hi = nextOld < n ? match.get(nextOld) - 1 : m - 1;
    if (lo > hi) return -1;

    const bigrams = s => { const set = new Set(); for (let k = 0; k < s.length - 1; k++) set.add(s.slice(k, k + 2)); return set; };
    const target = bigrams(oldS[f.index].text);
    let best = lo, bestScore = -1;
    for (let j = lo; j <= hi; j++) {
      const b = bigrams(newS[j].text);
      let common = 0;
      for (const g of b) if (target.has(g)) common++;
      const score = (2 * common) / ((b.size + target.size) || 1);
      if (score > bestScore) { bestScore = score; best = j; }
    }
    return best;
  }

  // 編集前後の本文を比較し、フォーカス中の文・範囲が新しい本文のどこに当たるかを求める
  function remapFocus(oldVal, newVal, f) {
    let p = 0;
    const max = Math.min(oldVal.length, newVal.length);
    while (p < max && oldVal[p] === newVal[p]) p++;
    let s = 0;
    while (s < max - p && oldVal[oldVal.length - 1 - s] === newVal[newVal.length - 1 - s]) s++;
    const delta = newVal.length - oldVal.length;
    const editEnd = oldVal.length - s;

    let start = f.start, end = f.end;
    if (oldVal === newVal || p >= f.end) {
      // 変更なし、またはフォーカスより後ろの編集
    } else if (editEnd <= f.start) {
      start += delta; end += delta;
    } else {
      start = Math.min(f.start, p);
      end = Math.max(start, f.end + delta);
    }
    start = Math.max(0, Math.min(start, newVal.length));
    end = Math.max(start, Math.min(end, newVal.length));

    if (f.kind === 'sentence') {
      const i = mapSentenceIndex(f, newVal);
      if (i >= 0) {
        const x = state.sentences[i];
        return { text: x.text, start: x.start, end: x.end, kind: 'sentence', index: i, base: newVal };
      }
      return null;
    }
    const raw = newVal.slice(start, end);
    const text = raw.trim();
    if (!text) return null;
    const lead = raw.length - raw.trimStart().length;
    return { text, start: start + lead, end: start + lead + text.length, kind: 'range', index: -1, base: newVal };
  }

  // 再生成後、直前に選んでいた類似表現が新しい候補にあれば⑤も再表示する
  async function regenerateFocus(prevAltWord) {
    if (!getKey()) return;
    await generateAlternatives();
    if (!prevAltWord) return;
    for (let ti = 0; ti < state.tokens.length; ti++) {
      const ai = state.tokens[ti].alts.findIndex(a => a.word === prevAltWord);
      if (ai >= 0) { selectTag(ti, ai); return; }
    }
  }

  // =====================
  //   Gemini API
  // =====================
  async function callGemini(prompt) {
    const key = getKey();
    if (!key) { const e = new Error('Gemini APIキーが設定されていません。'); e.code = 'NOKEY'; throw e; }

    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        model: GEMINI_MODEL,
        input: prompt,
        store: false, // 入力文をサーバーに保存させない
        response_format: { type: 'text', mime_type: 'application/json' },
        generation_config: { temperature: 0.8 }
      })
    });

    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error?.message || msg; } catch (_) { /* 本文なし */ }
      const e = new Error(msg);
      if (res.status === 401 || res.status === 403) e.code = 'BADKEY';
      throw e;
    }

    const data = await res.json();
    const raw = (data.steps || [])
      .filter(s => s.type === 'model_output')
      .flatMap(s => s.content || [])
      .filter(c => c.type === 'text')
      .map(c => c.text || '')
      .join('');
    try {
      return JSON.parse(raw.replace(/^```(?:json)?|```$/gim, '').trim());
    } catch (_) {
      throw new Error('AIの応答を解釈できませんでした。もう一度お試しください。');
    }
  }

  function errorHtml(e, prefix) {
    let hint = '';
    if (e.code === 'NOKEY') hint = '右上の「⚙ APIキー」から設定してください。';
    else if (e.code === 'BADKEY') hint = 'APIキーが正しいか確認してください。';
    return `<div class="error-msg">⚠️ ${esc(prefix)}<br>${esc(e.message)}${hint ? '<br>' + esc(hint) : ''}</div>`;
  }

  // 文脈判断の材料として、対象文の周辺（本文全体の一部）を渡す
  function surroundingText() {
    const f = state.focus;
    const full = ta.value;
    if (full.length <= 1200) return full;
    const from = Math.max(0, f.start - 500);
    return full.slice(from, Math.min(full.length, f.end + 500));
  }

  // =====================
  //   ④ 「生成する」：言い回し・単語ごとの類似表現
  // =====================
  function normalizeTokens(tokens, text) {
    if (!Array.isArray(tokens)) return [];
    const result = [];
    for (const t of tokens) {
      if (!t || typeof t.word !== 'string' || !text.includes(t.word) || !Array.isArray(t.alts)) continue;
      const seen = new Set([t.word]);
      const alts = [];
      for (const a of t.alts) {
        const w = typeof a === 'string' ? a : a?.word;
        if (typeof w !== 'string' || !w.trim() || seen.has(w.trim())) continue;
        seen.add(w.trim());
        alts.push({ word: w.trim(), mismatch: !!(a && a.mismatch) });
      }
      if (alts.length) result.push({ word: t.word, type: String(t.type || ''), alts });
    }
    return result;
  }

  async function generateAlternatives() {
    const f = state.focus;
    if (!f) { toast('文を選択してください'); return; }
    if (!getKey()) { openKeyDialog(); return; }

    const seq = ++genSeq;
    loadTokenizer().catch(() => {}); // 単語解説用の辞書を先読み（失敗しても無視）
    const btn = $('generateBtn');
    btn.disabled = true;
    $('centerBody').innerHTML = loadingHtml('AIが解析中…');

    const prompt = `
あなたは日本語小説の推敲を支援する編集者です。次の「対象文」を、意味のまとまり（単語・言い回し・慣用句）ごとに区切り、それぞれの類似表現を提案してください。
文章そのものを書き直してはいけません。あくまで書き手が選ぶための候補を出します。

作品の周辺の文章（文体の参考）：
「${surroundingText()}」

対象文：
「${f.text}」

条件：
- 区切った表現（word）は、必ず対象文の中にそのままの形で現れる部分文字列にすること
- 出現順に並べ、最大8個まで。助詞だけ・記号だけのものは除く。名詞・動詞・形容詞・副詞・慣用的な言い回しを中心にする
- 各表現につき類似表現（alts）を3〜5個。元の表現と置き換えて文として成立する活用・接続の形で書くこと
- mismatch:true は、意味は近いが作品の文体・雰囲気にそぐわないもの（和語中心の文に硬い漢語を混ぜる等）。各表現に1〜2個含めること
- type は品詞または「慣用句」「連語」などの種別

次のJSONのみで返答すること：
{"tokens":[{"word":"元の表現","type":"品詞","alts":[{"word":"類似表現","mismatch":false}]}]}
`;

    try {
      const parsed = await callGemini(prompt);
      if (seq !== genSeq) return;
      state.tokens = normalizeTokens(parsed.tokens, f.text);
      if (!state.tokens.length) throw new Error('有効な候補が得られませんでした。もう一度お試しください。');
      state.activeTag = null;
      renderTokens();
    } catch (e) {
      if (seq === genSeq) $('centerBody').innerHTML = errorHtml(e, '類似表現を生成できませんでした。');
    } finally {
      if (seq === genSeq) btn.disabled = !state.focus;
    }
  }

  $('generateBtn').addEventListener('click', generateAlternatives);

  const RELOAD_SVG = `
    <svg class="reload-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>`;

  const altTagsHtml = (token, ti) => token.alts.map((a, ai) => `
    <button type="button" class="alt-tag${a.mismatch ? ' mismatch' : ''}${
      state.activeTag && state.activeTag.tokenIdx === ti && state.activeTag.altIdx === ai ? ' selected' : ''}"
      data-act="tag" data-t="${ti}" data-a="${ai}"
      title="${a.mismatch ? '雰囲気にそぐわない可能性あり' : ''}">${esc(a.word)}</button>`).join('');

  function renderTokens() {
    let html = `
      <div class="tag-legend">
        <div class="tag-legend-item"><div class="legend-dot match"></div><span>文脈に合う</span></div>
        <div class="tag-legend-item"><div class="legend-dot mismatch"></div><span>雰囲気にそぐわない</span></div>
      </div>
      <div class="token-section">
        <div class="token-section-label">言い換え候補</div>`;

    state.tokens.forEach((token, ti) => {
      html += `
        <div class="token-row">
          <div class="token-original">
            <div class="token-left">
              <span>${esc(token.word)}</span>
              ${token.type ? `<span class="token-type">${esc(token.type)}</span>` : ''}
            </div>
            <button type="button" class="reload-btn" data-act="reload" data-t="${ti}" title="候補を再生成">${RELOAD_SVG}</button>
          </div>
          <div class="token-alts" id="token-alts-${ti}">${altTagsHtml(token, ti)}</div>
        </div>`;
    });

    $('centerBody').innerHTML = html + '</div>';
  }

  $('centerBody').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'tag')    selectTag(Number(el.dataset.t), Number(el.dataset.a));
    if (el.dataset.act === 'reload') reloadToken(el, Number(el.dataset.t));
  });

  // =====================
  //   リロード：1つの表現だけ再生成
  // =====================
  async function reloadToken(btn, ti) {
    const token = state.tokens[ti];
    const f = state.focus;
    if (!token || !f || btn.classList.contains('spinning')) return;
    if (!getKey()) { openKeyDialog(); return; }

    const seq = genSeq;
    btn.classList.add('spinning');

    const prompt = `
あなたは日本語小説の推敲を支援する編集者です。
対象文「${f.text}」の中の表現「${token.word}」（${token.type}）の類似表現を、これまでと異なるものを中心に提案してください。
作品の周辺の文章（文体の参考）：「${surroundingText()}」
すでに提示済みの候補（重複させない）：${token.alts.map(a => a.word).join('、')}

条件：
- 3〜5個。「${token.word}」と置き換えて文として成立する形で書くこと
- mismatch:true は意味は近いが作品の文体・雰囲気にそぐわないもの（1〜2個含める）

次のJSONのみで返答すること：
{"alts":[{"word":"類似表現","mismatch":false}]}
`;

    try {
      const parsed = await callGemini(prompt);
      if (seq !== genSeq || state.tokens[ti] !== token) return;
      const fresh = normalizeTokens([{ word: token.word, type: token.type, alts: parsed.alts }], f.text);
      if (!fresh.length) throw new Error('有効な候補が得られませんでした。');
      token.alts = fresh[0].alts;
      if (state.activeTag && state.activeTag.tokenIdx === ti) state.activeTag = null;
      const div = $(`token-alts-${ti}`);
      if (div) {
        div.style.opacity = '0';
        div.innerHTML = altTagsHtml(token, ti);
        requestAnimationFrame(() => { div.style.opacity = '1'; });
      }
    } catch (e) {
      toast(`再生成に失敗しました：${e.message}`);
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // =====================
  //   ⑤ タグ選択：単語解説＋実在する文学作品の文脈
  // =====================
  const litCache = new Map();
  let litAbort = null;

  const WS_UA = 'WritingScope/1.0 (personal novel-editing tool; https://ja.wikisource.org)';
  const sleep = (ms, signal) => new Promise((resolve, reject) => {
    const t = setTimeout(resolve, ms);
    signal?.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('aborted', 'AbortError')); }, { once: true });
  });

  // Wikimedia API の利用マナー：識別用ヘッダー、直列リクエスト、制限時は指数バックオフで再試行
  async function wsApi(params, signal, base = WIKISOURCE_API) {
    const qs = new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', ...params });
    for (let attempt = 0; attempt < 3; attempt++) {
      const res = await fetch(`${base}?${qs}`, { signal, headers: { 'Api-User-Agent': WS_UA } });
      let limited = res.status === 429 || res.status === 503;
      if (!limited) {
        if (!res.ok) throw new Error(`Wikisource HTTP ${res.status}`);
        const data = await res.json();
        if (!data.error) return data;
        limited = ['ratelimited', 'maxlag'].includes(data.error.code);
        if (!limited) throw new Error(data.error.info || data.error.code);
      }
      await sleep(1000 * 2 ** attempt, signal);
    }
    throw new Error('Wikisourceが混雑しています。しばらくしてからお試しください。');
  }

  const NOISE_CATEGORY = /^\d+%$|^PD|年$|^日本|全集|^著作|^翻訳|^青空文庫|^作品|^小説|^書籍|^索引|^ページ/;

  // 語句を含む作品を Wikisource から検索する。ヒットしなければ活用語尾を落として再検索
  async function searchLiterature(word, signal) {
    const clean = word.replace(/["\\]/g, '').trim();
    if (!clean) return { query: word, items: [] };
    if (litCache.has(clean)) return litCache.get(clean);

    const queries = [clean];
    if (clean.length >= 3 && /[ぁ-ん]$/.test(clean)) queries.push(clean.slice(0, -1));

    let hits = [], used = clean;
    for (const q of queries) {
      const r = await wsApi({ action: 'query', list: 'search', srsearch: `"${q}"`, srnamespace: '0', srlimit: '12', srprop: 'snippet' }, signal);
      hits = r.query?.search || [];
      if (hits.length) { used = q; break; }
    }

    let items = [];
    if (hits.length) {
      const cat = await wsApi({
        action: 'query', prop: 'categories', cllimit: 'max',
        pageids: hits.map(h => h.pageid).join('|')
      }, signal);
      const catsById = new Map((cat.query?.pages || []).map(p => [
        p.pageid, (p.categories || []).map(c => c.title.replace(/^[^:]+:/, ''))
      ]));
      items = hits.map(h => {
        const cats = catsById.get(h.pageid) || [];
        return {
          title: h.title,
          snippet: h.snippet,
          author: cats.find(c => !NOISE_CATEGORY.test(c)) || '',
          japanese: cats.some(c => /^日本の(小説|近代文学|文学)/.test(c)),
        };
      });
      items.sort((a, b) => Number(b.japanese) - Number(a.japanese));
      items = items.slice(0, 4);
    }

    const result = { query: used, items };
    litCache.set(clean, result);
    return result;
  }

  function snippetHtml(snippet, word) {
    const doc = new DOMParser().parseFromString(snippet, 'text/html');
    const text = doc.body.textContent;
    const at = text.indexOf(word);
    if (at >= 0) {
      return `…${esc(text.slice(0, at))}<span class="match-word">${esc(word)}</span>${esc(text.slice(at + word.length))}…`;
    }
    let out = '';
    doc.body.childNodes.forEach(n => {
      out += n.nodeType === 1 && n.classList.contains('searchmatch')
        ? `<span class="match-word">${esc(n.textContent)}</span>` : esc(n.textContent);
    });
    return `…${out}…`;
  }

  function literatureHtml(result) {
    if (!result.items.length) {
      return `<div class="note-msg">「${esc(result.query)}」を含む作品は、検索対象の電子テキストの中に見つかりませんでした。別の表現でもお試しください。</div>`;
    }
    const cards = result.items.map(it => `
      <div class="context-card">
        <div class="context-card-header">
          <div class="work-title"><a href="https://ja.wikisource.org/wiki/${encodeURIComponent(it.title)}" target="_blank" rel="noopener">${esc(it.title)}</a></div>
          ${it.author ? `<div class="work-author">${esc(it.author)}</div>` : ''}
        </div>
        <div class="context-card-body">${snippetHtml(it.snippet, result.query)}</div>
      </div>`).join('');
    return cards + `<div class="source-note">出典：<a href="https://ja.wikisource.org/" target="_blank" rel="noopener">Wikisource（日本語版）</a>の全文検索結果（「${esc(result.query)}」を含む箇所の抜粋）。各作品の本文の著作権・利用条件は、作品名のリンク先ページで確認してください。Wikisource上の編集部分は CC BY-SA 4.0 で提供されています。</div>`;
  }

  // =====================
  //   単語の意味：日本語版Wiktionaryから取得（生成AIは使わない）
  // =====================
  const dictCache = new Map();
  let dictAbort = null;
  let tokenizerPromise = null;

  // 形態素解析（基本形・読みの取得用）。初回のみ辞書を読み込む
  function loadTokenizer() {
    if (!tokenizerPromise) {
      tokenizerPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = KUROMOJI_BASE + 'build/kuromoji.js';
        s.onerror = () => reject(new Error('形態素解析ライブラリを読み込めませんでした'));
        s.onload = () => kuromoji.builder({ dicPath: KUROMOJI_BASE + 'dict/' })
          .build((err, t) => (err ? reject(err) : resolve(t)));
        document.head.appendChild(s);
      }).catch(e => { tokenizerPromise = null; throw e; });
    }
    return tokenizerPromise;
  }

  const toHiragana = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const isKana = s => /^[\u3041-\u309f\u30a1-\u30ff\u30fc]+$/.test(s);
  const CONTENT_POS = ['名詞', '動詞', '形容詞', '副詞', '連体詞'];

  // 表現から辞書を引く候補（見出し語・読み・品詞）を優先順に作る
  function buildCandidates(word, tokenizer) {
    const fallback = [{ head: word.replace(/(と|に)$/, ''), reading: '', pos: '' }];
    if (!tokenizer) return fallback;

    const lemmaReading = lemma => toHiragana(
      tokenizer.tokenize(lemma).map(t => t.reading || t.surface_form).join(''));
    const toks = tokenizer.tokenize(word);
    const out = [];

    // 句全体の基本形（「目を覚まし」→「目を覚ます」）。末尾の助詞は除く
    const body = [...toks];
    while (body.length > 1 && ['助詞', '助動詞'].includes(body[body.length - 1].pos)) body.pop();
    if (body.length > 1) {
      const last = body[body.length - 1];
      const lastBase = last.basic_form && last.basic_form !== '*' ? last.basic_form : last.surface_form;
      const head = body.slice(0, -1).map(t => t.surface_form).join('') + lastBase;
      out.push({ head, reading: lemmaReading(head), pos: last.pos, phrase: true });
    }

    // 内容語を後ろから（句の主要部は後ろにあることが多い）
    let content = toks.filter(t => CONTENT_POS.includes(t.pos)
      && !(t.pos === '名詞' && ['非自立', '代名詞', '接尾'].includes(t.pos_detail_1))
      && !(t.pos === '動詞' && ['非自立', '接尾'].includes(t.pos_detail_1)));
    if (content.some(t => t.pos === '名詞')) content = content.filter(t => t.basic_form !== 'する');
    for (const t of content.reverse()) {
      const head = t.basic_form && t.basic_form !== '*' ? t.basic_form : t.surface_form;
      if (out.some(c => c.head === head)) continue;
      const pos = t.pos === '名詞' && t.pos_detail_1 === '形容動詞語幹' ? '形容動詞' : t.pos;
      out.push({ head, reading: lemmaReading(head), pos });
    }
    return out.length ? out.slice(0, 4) : fallback;
  }

  const POS_TEMPLATE = {
    noun: '名詞', verb: '動詞', adv: '副詞', adverb: '副詞', adjective: '形容詞',
    adjectivenoun: '形容動詞', 'adjectival noun': '形容動詞', adnominal: '連体詞',
    pronoun: '代名詞', conj: '接続詞', interj: '感動詞', prefix: '接頭辞', suffix: '接尾辞',
    particle: '助詞', counter: '助数詞', phrase: '句', idiom: '慣用句', proverb: 'ことわざ',
    syn: '類義語', ant: '対義語',
  };

  function expandTemplate(body) {
    const [name, ...args] = body.split('|').map(x => x.trim());
    switch (name) {
      case 'タグ': return `（${args.slice(1).join('・')}）`;
      case 'ふりがな': return args[0] || '';
      case 'おくりがな2': return (args[0] || '') + (args[2] || '');
      case 'w': case 'wikipedia': return args[args.length - 1] || '';
      default: return POS_TEMPLATE[name] || '';
    }
  }

  function wikiToText(s) {
    let prev;
    do { prev = s; s = s.replace(/\{\{([^{}]*)\}\}/g, (_, body) => expandTemplate(body)); } while (s !== prev);
    return s
      .replace(/<ref[^>]*\/>|<ref[^>]*>[\s\S]*?<\/ref>/g, '')
      .replace(/<[^>]+>/g, '')
      .replace(/\[\[([^\]|]*\|)?([^\]]*)\]\]/g, '$2')
      .replace(/\[https?:\/\/\S+\s+([^\]]+)\]/g, '$1')
      .replace(/'{2,}/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Wiktionaryの日本語項目から、品詞ごとの意味・類義語・対義語を取り出す
  function parseEntry(wikitext) {
    const m = wikitext.match(/^==\s*(?:\{\{(?:L\|)?ja\}\}|日本語)\s*==\s*$/m);
    if (!m) return [];
    let ja = wikitext.slice(m.index + m[0].length);
    const next = ja.search(/^==[^=].*==\s*$/m);
    if (next >= 0) ja = ja.slice(0, next);

    const parts = ja.split(/^(={3,4})\s*(.+?)\s*\1\s*$/m); // [前置, 記号, 見出し, 本文, ...]
    const sections = [];
    let cur = null, sub = null;
    for (let i = 1; i < parts.length; i += 3) {
      const level = parts[i].length, title = wikiToText(parts[i + 1]), body = parts[i + 2] || '';
      if (level === 3) {
        const [label, ...rest] = title.split(/[・:：]/);
        cur = { label: label.trim(), hint: rest.join('・'), senses: [], syn: '', ant: '' };
        sections.push(cur);
        sub = null;
        for (const line of body.split('\n')) {
          const sm = line.match(/^#(?![*:#;])\s*(.*)$/);
          const text = sm && wikiToText(sm[1]);
          if (text && !/を参照|の漢字表記/.test(text)) cur.senses.push(text);
        }
      } else if (cur) {
        const list = body.split('\n').filter(l => /^\*/.test(l)).map(l => wikiToText(l.replace(/^\*+/, ''))).filter(Boolean).join('、');
        if (/^類義語$/.test(title)) cur.syn = list;
        if (/^対義語$/.test(title)) cur.ant = list;
      }
    }
    return sections.filter(s => s.senses.length);
  }

  async function lookupDictionary(word, signal, waitFor) {
    if (dictCache.has(word)) return dictCache.get(word);

    let tokenizer = null;
    try { tokenizer = await loadTokenizer(); } catch (e) { console.warn('kuromoji:', e); }
    const cands = buildCandidates(word, tokenizer);
    await waitFor;
    if (signal?.aborted) throw new DOMException('aborted', 'AbortError');

    // 漢字表記の見出しと、かな見出し（和語は多くがかな）をまとめて1リクエストで取得
    const titles = [];
    for (const c of cands) for (const t of [c.head, c.reading]) if (t && !titles.includes(t)) titles.push(t);
    const r = await wsApi({
      action: 'query', prop: 'revisions', rvprop: 'content', rvslots: 'main', redirects: '1',
      titles: titles.slice(0, 12).join('|')
    }, signal, WIKTIONARY_API);
    const pages = new Map((r.query?.pages || []).filter(p => !p.missing && p.revisions)
      .map(p => [p.title, p.revisions[0].slots.main.content]));
    // redirects で見出しが変わった場合に備えて元の見出しも引けるようにする
    for (const rd of r.query?.redirects || []) if (pages.has(rd.to)) pages.set(rd.from, pages.get(rd.to));

    let result = { found: false, query: cands[0].head, word };
    search:
    for (const c of cands) {
      const wanted = c.pos === '形容動詞' ? ['形容動詞', '名詞'] : [c.pos];
      for (const title of [c.head, c.reading]) {
        if (!title || !pages.has(title)) continue;
        const sections = parseEntry(pages.get(title));
        if (!sections.length) continue;
        const score = s => (wanted.includes(s.label) ? 2 : 0)
          + (s.hint && [...s.hint].some(ch => /[\u4e00-\u9fff]/.test(ch) && c.head.includes(ch)) ? 3 : 0);
        const best = sections.reduce((a, b) => score(b) > score(a) ? b : a);
        result = {
          found: true, word, query: c.head, title, section: best,
          reading: isKana(title) ? title : c.reading,
          headword: c.head,
        };
        break search;
      }
    }
    dictCache.set(word, result);
    return result;
  }

  function dictLinksHtml(query) {
    const q = encodeURIComponent(query);
    const a = (href, label) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
    return `<div class="dict-links"><span>他の辞書で調べる：</span>
      ${a(`https://www.google.com/search?q=${encodeURIComponent(query + ' 意味')}`, 'Google')}
      ${a(`https://www.weblio.jp/content/${q}`, 'Weblio')}
      ${a(`https://ja.wiktionary.org/w/index.php?search=${q}`, 'Wiktionary')}
    </div>`;
  }

  function replaceButtonHtml(tokenIdx, altIdx) {
    const token = state.tokens[tokenIdx];
    const alt = token.alts[altIdx];
    const canReplace = state.focus && state.focus.text.includes(token.word);
    return `
      <button type="button" class="replace-btn" data-act="replace" ${canReplace ? '' : 'disabled'}>
        「${esc(token.word)}」を「${esc(alt.word)}」に置き換える
      </button>`;
  }

  function wordInfoHtml(info, tokenIdx, altIdx) {
    const alt = state.tokens[tokenIdx].alts[altIdx];
    let card;
    if (info.found) {
      const s = info.section;
      const shown = s.senses.slice(0, 3), rest = s.senses.slice(3);
      const li = arr => arr.map(x => `<li>${esc(x)}</li>`).join('');
      const extra = [s.syn && `類義語：${s.syn}`, s.ant && `対義語：${s.ant}`].filter(Boolean);
      card = `
        <div class="word-card">
          <div class="word-card-header">
            <span class="word-name">${esc(alt.word)}</span>
            ${info.reading ? `<span class="word-reading">${esc(info.reading)}</span>` : ''}
          </div>
          <div class="word-card-body">
            <span class="word-pos-badge">${esc(s.label)}</span>
            ${info.headword !== alt.word ? `<div class="word-headword">辞書の見出し：${esc(info.title)}</div>` : ''}
            <ol class="word-senses word-definition">${li(shown)}</ol>
            ${rest.length ? `<details class="word-more"><summary>ほか ${rest.length} 件の意味</summary><ol class="word-senses" start="4">${li(rest)}</ol></details>` : ''}
            ${extra.length ? `<div class="word-nuance">📝 ${extra.map(esc).join('<br>')}</div>` : ''}
          </div>
        </div>
        <div class="source-note">出典：<a href="https://ja.wiktionary.org/wiki/${encodeURIComponent(info.title)}" target="_blank" rel="noopener noreferrer">日本語版Wiktionary「${esc(info.title)}」</a>（<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>）</div>`;
    } else {
      card = `<div class="note-msg">辞書に「${esc(info.query)}」の項目が見つかりませんでした。下のリンクから他の辞書で調べられます。</div>`;
    }
    return `
      <div class="right-section-label">単語解説</div>
      ${card}
      ${dictLinksHtml(info.query)}
      ${replaceButtonHtml(tokenIdx, altIdx)}`;
  }

  async function selectTag(ti, ai) {
    const token = state.tokens[ti];
    const alt = token && token.alts[ai];
    const f = state.focus;
    if (!alt || !f) return;

    // 同じタグの再クリックで選択解除
    const same = state.activeTag && state.activeTag.tokenIdx === ti && state.activeTag.altIdx === ai;
    state.activeTag = same ? null : { tokenIdx: ti, altIdx: ai };
    document.querySelectorAll('.alt-tag.selected').forEach(t => t.classList.remove('selected'));
    if (same) {
      selectSeq++;
      $('rightBody').innerHTML = emptyHtml('📖', '類似表現タグをクリックすると<br>単語解説と文学作品の<br>文脈が表示されます。');
      return;
    }
    document.querySelector(`.alt-tag[data-t="${ti}"][data-a="${ai}"]`)?.classList.add('selected');

    const seq = ++selectSeq;
    const word = alt.word;
    const right = $('rightBody');
    right.innerHTML = `
      <div class="selected-tag-display">
        <span>選択中：</span><span class="tag-value">「${esc(token.word)}」→「${esc(word)}」</span>
      </div>
      <div id="wordInfo">${loadingHtml('辞書を引いています…', true)}</div>
      <div class="right-section-label">文学作品での文脈</div>
      <div id="litInfo">${loadingHtml('作品中の用例を検索中…', true)}</div>`;

    if (isMobile()) switchTab(2);

    const literature = (async () => {
      // 連続クリック時に無駄な通信をしないよう、少し待ってから検索する
      litAbort?.abort();
      litAbort = new AbortController();
      const signal = litAbort.signal;
      if (!litCache.has(word)) await sleep(300, signal);
      return searchLiterature(word, signal);
    })();

    // Wikimediaへのリクエストは直列にするため、用例検索の完了後に辞書を引く
    dictAbort?.abort();
    dictAbort = new AbortController();
    lookupDictionary(word, dictAbort.signal, literature.catch(() => {})).then(info => {
      if (seq !== selectSeq) return;
      $('wordInfo').innerHTML = wordInfoHtml(info, ti, ai);
    }).catch(e => {
      if (seq !== selectSeq) return;
      $('wordInfo').innerHTML = `
        <div class="right-section-label">単語解説</div>
        ${errorHtml(e, '辞書を引けませんでした。')}
        ${dictLinksHtml(word)}
        ${replaceButtonHtml(ti, ai)}`;
    });

    literature.then(result => {
      if (seq !== selectSeq) return;
      $('litInfo').innerHTML = literatureHtml(result);
    }).catch(e => {
      if (seq !== selectSeq) return;
      $('litInfo').innerHTML = errorHtml(e, '文学作品の用例を取得できませんでした。');
    });
  }

  // =====================
  //   選択した表現で本文を置き換える
  // =====================
  $('rightBody').addEventListener('click', e => {
    if (e.target.closest('[data-act="replace"]')) applyReplacement();
  });

  function applyReplacement() {
    const f = state.focus, at = state.activeTag;
    const token = at && state.tokens[at.tokenIdx];
    if (!f || !token) return;
    const alt = token.alts[at.altIdx];

    const pos = f.text.indexOf(token.word);
    if (pos < 0) { toast('対象の表現が現在の文に見つかりません'); return; }
    let start = ta.value.slice(f.start, f.end) === f.text ? f.start : ta.value.indexOf(f.text);
    if (start < 0) { toast('本文が編集されたため置き換えできません。もう一度文を選んでください'); return; }

    const newText = f.text.slice(0, pos) + alt.word + f.text.slice(pos + token.word.length);
    ta.value = ta.value.slice(0, start) + newText + ta.value.slice(start + f.text.length);
    localStorage.setItem(LS_DRAFT, ta.value);

    if (state.split) { state.sentences = splitSentences(ta.value); state.baseText = ta.value; }
    const idx = f.kind === 'sentence' ? state.sentences.findIndex(s => s.start === start) : -1;
    state.focus = { ...f, text: newText, start, end: start + newText.length, index: f.kind === 'sentence' ? idx : -1, base: ta.value };
    if (f.kind === 'sentence' && idx < 0) state.focus.kind = 'range';

    // 置き換えた表現を新しい「元の表現」として扱う
    token.word = alt.word;
    state.activeTag = null;
    renderFocus();
    renderTokens();
    $('rightBody').innerHTML = emptyHtml('✅', `「${esc(alt.word)}」に置き換えました。<br>続けて他の表現も検討できます。`);
    toast('本文を置き換えました');
  }

  // =====================
  //   初期化
  // =====================
  ta.value = localStorage.getItem(LS_DRAFT) ?? SAMPLE_TEXT;
  updateKeyBanner();
  resetResults();
  renderFocus();
</script>
</body>
</html>
